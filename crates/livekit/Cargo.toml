[package]
name = "surveillance-livekit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal to this workspace; never published to a registry.
publish = false

[lints]
workspace = true

[dependencies]
livekit.workspace = true
getrandom.workspace = true
# To pull frames off the subscriber's video stream, which is a `Stream`.
futures-util.workspace = true
livekit-api.workspace = true
serde.workspace = true
serde_json.workspace = true
surveillance-common = { path = "../common" }
surveillance-events = { path = "../events" }
surveillance-media = { path = "../media" }
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Only to build the signal-client status codes the retry classification keys
# off; nothing in the library takes an HTTP dependency.
http.workspace = true
# The room fixture joins a real room as a subscriber, which is the only way to
# prove a track reached one. The library already depends on this; a test can
# only reach it through a development dependency.
livekit.workspace = true
# To pull frames off the subscriber's video stream, which is a `Stream`.
futures-util.workspace = true
