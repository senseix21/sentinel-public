# Deployment reference. Never place real credentials or tokens in this file.
#
# This is a working example of the file layer, which sits above the compiled
# defaults and below persisted settings and the environment:
#
#   compiled defaults < this file < persisted settings < environment
#
# Copy it, edit it, and point the server at it. Keys are the durable setting
# identities — the same strings the settings API, metrics, and audit rows use.
# Unknown keys are rejected, so a typo fails at startup rather than silently
# doing nothing.
#
# Durations always carry a unit: ms, s, m, h, d.

# --- Secrets are NOT configured here -----------------------------------------
# Credentials come from the Phase 8 secret boundary: a permission-enforced
# secrets file with per-key environment override. They are neither persisted as
# ordinary settings nor accepted through the settings API. Environment values
# used by the current server bootstrap include:
#
#   SURVEILLANCE_DATABASE_URL
#   SURVEILLANCE_RTSP_USERNAME       (with SURVEILLANCE_RTSP_PASSWORD)
#   SURVEILLANCE_RTSP_PASSWORD
#   SURVEILLANCE_LIVEKIT_API_KEY
#   SURVEILLANCE_LIVEKIT_API_SECRET
#
# The fingerprint salt is also a secret, and has no default on purpose: a shared
# default would make audit fingerprints comparable across deployments.
#
#   SURVEILLANCE_AUDIT_FINGERPRINT_SALT

[server]
health_bind = "127.0.0.1:3000"

[storage]
recording_root = "/srv/surveillance/recordings"
watermark_warning = 75
watermark_critical = 88
watermark_emergency = 95
watermark_hysteresis = 3

[api]
# Leave false unless this deployment is meant to be reconfigured over HTTP.
# Authentication and authorization are enforced independently of this switch.
# Keep the listener loopback-only unless ADR 009's trusted proxy boundary and
# an enabled principal are configured.
mutating_surface_enabled = false
# The two settings that are read per request rather than captured at startup.
max_request_bytes = 16384
io_timeout = "5s"
# The accept loop handles connections serially. That is a property of the
# implementation, not a configurable limit, so there is no concurrency setting.

[retention]
# A ten-camera unit keeping two weeks of footage. Raise max_age only after
# confirming the disk can hold it — retention deletes from indexed metadata,
# and storage watermarks are the backstop, not the plan.
max_age = "14d"
protected_recent = "2h"
interval = "1m"

# --- Per-camera templates ----------------------------------------------------
# Applied to every camera that does not override them.

[camera.recording]
segment_duration = "30s"

[camera.detection]
enabled = true
sample_fps = 5

# --- Inference ---------------------------------------------------------------
# No model ships in this repository. Weights are a deployment artifact: put the
# .onnx file on the host and point model_path at it. Leaving model_path unset is
# a legitimate state and the shipped one — the detector keeps its fixture
# backend and the API continues to report results_are_fixture, so nothing claims
# detections it cannot support. A model_path that is set but cannot be loaded
# refuses startup rather than silently degrading (ADR 015).
#
# Apply-time: model_path, model_sha256, input_width, input_height,
# execution_providers, intra_op_threads and inter_op_threads rebuild that
# camera's pipeline, which interrupts its recording and is operator-triggered.
# Thresholds and gate timings are captured by the detector at startup. Changes
# require an operator-triggered camera pipeline restart, which interrupts recording.
#
# model_path = "/srv/surveillance/models/yolox_tiny.onnx"
# model_sha256 = "427cc366d34e27ff7a03e2899b5e3671425c262ea2291f88bb942bc1cc70b0f7"

# The model's input geometry. The detector scales each frame to exactly this,
# so these also set the decoded frame size and are checked against the camera's
# memory budget.
input_width = 416
input_height = 416

# Ordered, comma-separated: cpu, cuda, or tensorrt. Unknown or unavailable
# providers refuse startup rather than silently falling back. Availability
# reported by the runtime is not proof: warm-up inference validates the session.
execution_providers = "cpu"

# One thread each. A session per camera with machine-sized pools would contend
# through a single blocking pool; raise these only against measurements.
intra_op_threads = 1
inter_op_threads = 1

# Fractions are whole percentages, as the storage watermarks are: the settings
# value model has no float, and integers stay exact through TOML, the database
# and JSON. Values above 100 are refused at startup, naming the key.
score_threshold_percent = 30
nms_iou_percent = 45

# The motion gate. It reduces inference only: H.264 inter-frames cannot be
# decoded in isolation, so the decoder runs regardless of how much this skips.
# The cooldown keeps a person who stops moving from vanishing; the heartbeat
# bounds the damage from a threshold set too high.
motion_threshold_percent = 2
gate_cooldown = "5s"
gate_heartbeat = "10s"

# --- Per-camera overrides ----------------------------------------------------
# A camera's own value beats the template above. Within one layer, specific
# beats general; across layers, the higher layer wins outright.

[cameras."lobby-01".rtsp]
endpoint = "rtsp://10.0.0.11:554/Streaming/Channels/101"

[cameras."lobby-01".video]
width = 1920
height = 1080

[cameras."lobby-01".detection]
decoded_frame_max_bytes = 6220800

[cameras."dock-02".rtsp]
endpoint = "rtsp://10.0.0.12:554/Streaming/Channels/101"

[cameras."dock-02".video]
width = 2560
height = 1440

[cameras."dock-02".detection]
# A busier view sampled harder. Raising this raises decode cost, which is
# measured, not assumed.
sample_fps = 10
decoded_frame_max_bytes = 11059200
