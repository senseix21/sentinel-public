# Local manual-development bridge. It intentionally listens only on loopback
# and does not perform archival recording; the Rust recorder owns that concern.
logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  - user: any
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
        path: webcam
      - action: read
        path: webcam

rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:8554

rtmp: false
hls: false
webrtc: false
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false

paths:
  webcam:
