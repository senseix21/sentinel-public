logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  - user: fixture-publisher
    pass: fixture-publisher-pass
    ips: ["127.0.0.1"]
    permissions:
      - action: publish
        path: retina-fixture
  - user: fixture-reader
    pass: fixture-reader-pass
    ips: ["127.0.0.1"]
    permissions:
      - action: read
        path: retina-fixture

rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:18554

rtmp: false
hls: false
webrtc: false
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false

paths:
  retina-fixture:
