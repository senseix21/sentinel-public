[package]
name = "surveillance-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal to this workspace; never published to a registry.
publish = false

[lints]
workspace = true

[features]
# Development-only entry point for the isolated coverage-guided fuzz workspace.
fuzzing = []
# Passes the detector's optional ONNX backend through, so a build either has
# real inference everywhere or nowhere.
onnx-inference = ["surveillance-detector/onnx-inference"]

[dependencies]
fs2.workspace = true
jiff.workspace = true
chrono = { workspace = true }
subtle = { workspace = true }
surveillance-auth = { path = "../../crates/auth" }
surveillance-camera = { path = "../../crates/camera" }
surveillance-common = { path = "../../crates/common" }
surveillance-config = { path = "../../crates/config" }
surveillance-database = { path = "../../crates/database" }
surveillance-detector = { path = "../../crates/detector" }
surveillance-events = { path = "../../crates/events" }
surveillance-media = { path = "../../crates/media" }
surveillance-livekit = { path = "../../crates/livekit" }
surveillance-recorder = { path = "../../crates/recorder" }
surveillance-storage = { path = "../../crates/storage" }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
# Only to prove the vendored LiveKit browser SDK is byte-for-byte the bundle
# recorded in `ui/vendor/README.md`. Not used by the server itself.
sqlx.workspace = true
